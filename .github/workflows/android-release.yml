name: Build and release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RECORDER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RECORDER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RECORDER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RECORDER_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Missing Android release signing secrets." >&2
            echo "Configure RECORDER_KEYSTORE_BASE64, RECORDER_KEYSTORE_PASSWORD, RECORDER_KEY_ALIAS, and RECORDER_KEY_PASSWORD." >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/recorder-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "RECORDER_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "RECORDER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RECORDER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RECORDER_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$REF_NAME"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            echo "Use a semantic version such as v1.0.0 or v1.0.0-beta.1." >&2
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version_name=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleRelease -PreleaseVersion="$RELEASE_VERSION" -PreleaseVersionCode="$RELEASE_VERSION_CODE"

      - name: Prepare release asset
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: cp app/build/outputs/apk/release/app-release.apk "recorder-${RELEASE_TAG}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "recorder-${RELEASE_TAG}.apk" \
            --target "$GITHUB_SHA" \
            --title "Recorder $RELEASE_TAG" \
            --generate-notes
