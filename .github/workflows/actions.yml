name: load rules

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: checkout bugcrowd-crowdstream
        uses: actions/checkout@v3
        with:
          repository: Linuxinet/bugcrowd-crowdstream
          path: bugcrowd
          ref: master

      - name: list files
        run: |
          ls -lah bugcrowd