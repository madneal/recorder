name: load rules

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Source
        uses: actions/checkout@v3

      - name: Remove Old folder
        run: |
          - rm -rf bugcrowd

      - name: Checkout bugcrowd-crowdstream
        uses: actions/checkout@v3
        with:
          repository: Linuxinet/bugcrowd-crowdstream
          path: bugcrowd
          ref: master
      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.18'
          check-latest: true

      - name: Run main.go
        run: |
          go run ./main.go